
<div id="fieldExpandOverlay" class="fixed inset-0 bg-slate-950/95 z-[95] hidden flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-amber-600/60 rounded-2xl max-w-5xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/80">
      <div class="flex items-center space-x-3">
        <span class="text-amber-400 font-mono font-bold uppercase text-xs tracking-widest" id="expandFieldLabel">Field Editor</span>
      </div>
      <button type="button" onclick="closeFieldExpand()" class="text-slate-400 hover:text-slate-200 text-2xl leading-none">&times;</button>
    </div>
    <div class="p-6 flex-1 flex flex-col space-y-4 overflow-hidden">
      <textarea id="expandFieldTextarea" class="flex-1 w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-200 text-sm focus:outline-none focus:border-amber-500 font-sans leading-relaxed resize-none" placeholder="Enter content..."></textarea>
      <div class="flex items-center justify-between text-xs font-mono text-slate-500">
        <div class="flex space-x-4">
          <span>Words: <span id="expandWordCount" class="text-amber-400">0</span></span>
          <span>Chars: <span id="expandCharCount" class="text-amber-400">0</span></span>
        </div>
        <div class="flex space-x-3">
          <button type="button" onclick="closeFieldExpand()" class="px-4 py-2 text-slate-400 hover:text-slate-200 transition">Cancel</button>
          <button type="button" onclick="applyFieldExpand()" class="px-6 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded-lg transition shadow">Apply & Close</button>
        </div>
      </div>
    </div>
  </div>
</div>
